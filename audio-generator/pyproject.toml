[project]
name = "audiofier-audio-generator"
version = "0.1.0"
description = "Local FastAPI and CLI service for Audiofier TTS generation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
  "fastapi",
  "httpx",
  "kokoro",
  "numpy",
  "pydantic-settings",
  "qwen-tts",
  "soundfile",
  "torch==2.11.0+cu128 ; platform_system == 'Windows'",
  "torchaudio==2.11.0+cu128 ; platform_system == 'Windows'",
  "typer",
  "uvicorn",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "ruff",
]

[tool.uv]
link-mode = "copy"
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "platform_system == 'Windows'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "platform_system == 'Windows'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".venv", "output"]

[tool.ruff.lint]
select = [
  "A",      # builtins and import shadowing
  "B",      # bugbear correctness checks
  "C4",     # comprehensions
  "E",      # pycodestyle errors
  "F",      # pyflakes correctness checks
  "I",      # import sorting
  "ISC",    # implicit string concatenation
  "PIE",    # misc. likely-error checks
  "RET",    # return consistency
  "RUF",    # Ruff-native correctness and hygiene checks
  "SIM",    # simplification opportunities
  "TID",    # tidy imports
  "UP",     # supported Python-modernization rules
  "PTH",    # pathlib over os.path
]

[tool.ruff.lint.per-file-ignores]
"audio.py" = ["E402"]
"server.py" = ["E402"]
"tests/test_audio.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
