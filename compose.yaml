services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    image: audiofier-postgres:17
    environment:
      POSTGRES_DB: audiofier
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d audiofier"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - audiofier-postgres:/var/lib/postgresql/data

volumes:
  audiofier-postgres:
